name: deploy

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag, e.g. v1.2.0"
        type: string
        required: true
      environment:
        description: Target environment
        type: choice
        options:
          - dev
          - qa
          - prod
        default: dev
        required: true

permissions: {}

concurrency:
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false

env:
  CLOUDSDK_CORE_PROJECT: petclinic-capstone
  IMAGE_REPO: europe-west3-docker.pkg.dev/petclinic-capstone/petclinic/petclinic-app

  INFRA_REPO: tomasevicnikola/petclinic-infra

  APP_PORT: "8080"
  HEALTH_PATH: /actuator/health

  LB_ADDRESS_NAME: petclinic-${{ inputs.environment }}-lb-ip
  LB_BACKEND_SERVICE: petclinic-${{ inputs.environment }}-lb-backend
  APP_REGION: europe-west3

  # The rolling deploy writes the digest here; the infrastructure repository
  # reads it on every plan.
  APP_MIG: petclinic-${{ inputs.environment }}-app-mig
  APP_INSTANCE_PREFIX: petclinic-${{ inputs.environment }}-app-
  DEPLOY_STATE_BUCKET: petclinic-capstone-tfstate
  INFRA_APPLY_WORKFLOW: terraform-apply.yml

jobs:
  guard:
    name: Check the target is deployable
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Refuse prod
        env:
          ENVIRONMENT: ${{ inputs.environment }}
        run: |
          if [ "$ENVIRONMENT" = "prod" ]; then
            echo "::error::prod deploys are out of capstone scope. envs/prod exists in the infrastructure repository as a reviewed statement of intent and has never been applied - there is nothing running to deploy to. See docs/adr/0002-multi-environment-strategy.md in petclinic-infra."
            exit 1
          fi
          echo "Target '${ENVIRONMENT}' is deployable."

  deploy:
    name: Deploy ${{ inputs.version }} to ${{ inputs.environment }}
    runs-on: [self-hosted, gcp, ops]
    needs: guard
    if: github.event_name == 'workflow_dispatch'
    environment: ${{ inputs.environment }}

    timeout-minutes: 60

    permissions:
      contents: read

    steps:
      - name: Validate the version input
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::'${VERSION}' is not a release tag. Expected vMAJOR.MINOR.PATCH, for example v1.2.0."
            exit 1
          fi
          echo "Deploying version ${VERSION}."

      - name: Put the gcloud CLI on PATH
        run: echo "/snap/bin" >> "$GITHUB_PATH"

      - name: Checkout this repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Confirm the runner's GCP identity
        run: |
          set -euo pipefail
          gcloud auth list
          echo "Project: $(gcloud config get-value project 2>/dev/null)"

      - name: Resolve the version to an image digest
        id: resolve
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          echo "::group::Git tag"
          if ! git ls-remote --tags --exit-code \
                 "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git" \
                 "refs/tags/${VERSION}"; then
            echo "::error::Git tag '${VERSION}' does not exist in ${GITHUB_REPOSITORY}."
            exit 1
          fi
          echo "::endgroup::"

          echo "::group::Artifact Registry image"
          if ! DIGEST="$(gcloud artifacts docker images describe \
                           "${IMAGE_REPO}:${VERSION}" \
                           --format='value(image_summary.digest)' \
                           2>"${RUNNER_TEMP}/ar-describe.err")"; then
            echo "::error::No image tagged '${VERSION}' in ${IMAGE_REPO}."
            cat "${RUNNER_TEMP}/ar-describe.err" >&2
            exit 1
          fi
          DIGEST="$(echo "$DIGEST" | tr -d '[:space:]')"
          echo "${IMAGE_REPO}:${VERSION} -> ${DIGEST}"
          echo "::endgroup::"

          if [[ ! "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::Artifact Registry returned something that is not a digest: '${DIGEST}'"
            exit 1
          fi

          {
            echo "digest=${DIGEST}"
            echo "image=${IMAGE_REPO}@${DIGEST}"
            echo "image_tag=${IMAGE_REPO}:${VERSION}"
          } >> "$GITHUB_OUTPUT"

          echo "::notice::${VERSION} resolves to ${IMAGE_REPO}@${DIGEST}"


      # Rolling deploy: record the digest, let the infrastructure repository
      # rebuild the instance template around it, let the group replace its
      # instances.
      - name: Record the digest as the deployed version
        id: record
        env:
          DIGEST: ${{ steps.resolve.outputs.digest }}
          ENVIRONMENT: ${{ inputs.environment }}
        run: |
          set -euo pipefail
          OBJECT="gs://${DEPLOY_STATE_BUCKET}/deploy/${ENVIRONMENT}/app-image-digest"

          # Not "|| true": swallowing this once reported a 403 as "first deploy",
          # which is a different thing and hid the real cause.
          if PREVIOUS="$(gcloud storage cat "$OBJECT" 2>"${RUNNER_TEMP}/cat.err")"; then
            PREVIOUS="$(printf '%s' "$PREVIOUS" | tr -d '[:space:]')"
            echo "Currently deployed: ${PREVIOUS}"
            echo "previous=${PREVIOUS}" >> "$GITHUB_OUTPUT"
          else
            echo "Could not read the current digest:"
            sed 's/^/  /' "${RUNNER_TEMP}/cat.err"
            echo "Either nothing is recorded yet, or the object is unreadable."
            echo "The write below decides which."
          fi

          printf '%s' "$DIGEST" | gcloud storage cp - "$OBJECT"
          echo "Recorded ${DIGEST} at ${OBJECT}"

      - name: Trigger the infrastructure apply
        id: infra
        env:
          GH_TOKEN: ${{ secrets.INFRA_DISPATCH_TOKEN }}
          ENVIRONMENT: ${{ inputs.environment }}
          DIGEST: ${{ steps.resolve.outputs.digest }}
        run: |
          set -euo pipefail

          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::INFRA_DISPATCH_TOKEN is not set. This deploy dispatches a workflow in ${INFRA_REPO}, which the built-in GITHUB_TOKEN cannot do across repositories. Add a fine-grained PAT scoped to that repository with Actions: read and write."
            exit 1
          fi

          # The REST API rather than the gh CLI, which is not on the ops runner.
          api() {
            curl -sS --fail-with-body \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "$@"
          }

          # The dispatch endpoint returns no body, so the run is found by time.
          SINCE="$(date -u -d '-60 seconds' +%Y-%m-%dT%H:%M:%SZ)"

          api -X POST \
            "https://api.github.com/repos/${INFRA_REPO}/actions/workflows/${INFRA_APPLY_WORKFLOW}/dispatches" \
            -d "$(jq -nc --arg env "$ENVIRONMENT" --arg digest "$DIGEST" \
                    '{ref: "main", inputs: {environment: $env, app_image_digest: $digest}}')" \
            -o /dev/null
          echo "Dispatched ${INFRA_APPLY_WORKFLOW} in ${INFRA_REPO} for ${ENVIRONMENT} at ${DIGEST}."

          RUN_ID=""
          for _ in $(seq 1 30); do
            RUN_ID="$(api "https://api.github.com/repos/${INFRA_REPO}/actions/workflows/${INFRA_APPLY_WORKFLOW}/runs?per_page=20&event=workflow_dispatch" \
                      | jq -r --arg since "$SINCE" \
                          '[.workflow_runs[] | select(.created_at >= $since)]
                           | sort_by(.created_at) | last | .id // empty')"
            [ -n "$RUN_ID" ] && break
            sleep 5
          done

          if [ -z "$RUN_ID" ]; then
            echo "::error::Dispatched the apply but could not find the run in ${INFRA_REPO}. Check it manually before retrying - the digest is already recorded."
            exit 1
          fi

          RUN_URL="${GITHUB_SERVER_URL}/${INFRA_REPO}/actions/runs/${RUN_ID}"
          echo "run_url=${RUN_URL}" >> "$GITHUB_OUTPUT"
          echo "::notice::Infrastructure apply: ${RUN_URL}"

          # The apply sits behind an environment approval, so "waiting" is normal.
          echo "Waiting for the apply (this includes any environment approval)..."
          for attempt in $(seq 1 120); do
            RUN="$(api "https://api.github.com/repos/${INFRA_REPO}/actions/runs/${RUN_ID}")"
            STATUS="$(echo "$RUN" | jq -r .status)"
            CONCLUSION="$(echo "$RUN" | jq -r '.conclusion // ""')"

            if [ "$STATUS" = "completed" ]; then
              if [ "$CONCLUSION" = "success" ]; then
                echo "Apply succeeded after $(( attempt * 20 ))s."
                break
              fi
              echo "::error::The infrastructure apply finished as '${CONCLUSION}'. See ${RUN_URL}"
              exit 1
            fi

            if [ "$attempt" -eq 120 ]; then
              echo "::error::The infrastructure apply was still '${STATUS}' after 40 minutes. See ${RUN_URL}"
              exit 1
            fi

            [ $(( attempt % 6 )) -eq 1 ] && echo "apply is ${STATUS}... (${attempt}/120)"
            sleep 20
          done

      # Without this, nothing compares what was deployed to what is running: the
      # rollout wait below is satisfied trivially by a no-op apply, and the old
      # version answers the health check just as well as the new one.
      - name: Confirm the template carries the digest that was deployed
        env:
          DIGEST: ${{ steps.resolve.outputs.digest }}
          ENVIRONMENT: ${{ inputs.environment }}
        run: |
          set -euo pipefail

          TEMPLATE="$(gcloud compute instance-groups managed describe "$APP_MIG" \
                        --region="$APP_REGION" \
                        --format='value(versions[0].instanceTemplate)')"
          TEMPLATE="${TEMPLATE##*/}"

          ON_TEMPLATE="$(gcloud compute instance-templates describe "$TEMPLATE" --format=json \
                         | jq -r '.properties.metadata.items[]? | select(.key=="app-image-digest") | .value')"

          echo "Template:          ${TEMPLATE}"
          echo "Digest requested:  ${DIGEST}"
          echo "Digest on template: ${ON_TEMPLATE:-<absent>}"

          if [ -z "${ON_TEMPLATE}" ]; then
            echo "::error::The instance template has no app-image-digest metadata at all. The infrastructure repository is applying a revision that predates the baked-image change - merge and apply that branch first."
            exit 1
          fi

          if [ "${ON_TEMPLATE}" != "${DIGEST}" ]; then
            echo "::error::The apply completed but left ${ON_TEMPLATE} on the template, not ${DIGEST}. The digest object was probably not read - check that deploy/${ENVIRONMENT}/app-image-digest in the state bucket holds the value this run wrote."
            exit 1
          fi

          echo "::notice::Template ${TEMPLATE} carries ${DIGEST}."

      - name: Wait for the group to roll onto the new template
        run: |
          set -euo pipefail

          TEMPLATE="$(gcloud compute instance-groups managed describe "$APP_MIG" \
                        --region="$APP_REGION" \
                        --format='value(versions[0].instanceTemplate)')"
          TEMPLATE="${TEMPLATE##*/}"
          echo "Target template: ${TEMPLATE}"

          # apply returns once the version is set, not once the rollout finishes,
          # so isStable alone can read True before anything has been replaced.
          rollout_state() {
            gcloud compute instance-groups managed describe "$APP_MIG" \
              --region="$APP_REGION" --format='value(status.isStable)'
          }

          instances() {
            gcloud compute instance-groups managed list-instances "$APP_MIG" \
              --region="$APP_REGION" \
              --format='value(name,instanceStatus,version.instanceTemplate,instanceHealth[0].detailedHealthState)'
          }

          DONE=0
          for attempt in $(seq 1 60); do
            STABLE="$(rollout_state)"
            ON_TARGET=1
            COUNT=0

            while read -r NAME STATUS ITEMPLATE HEALTH; do
              [ -z "${NAME:-}" ] && continue
              COUNT=$(( COUNT + 1 ))
              [ "${ITEMPLATE##*/}" = "$TEMPLATE" ] || ON_TARGET=0
            done < <(instances)

            if [ "$STABLE" = "True" ] && [ "$ON_TARGET" -eq 1 ] && [ "$COUNT" -gt 0 ]; then
              echo "Rollout complete after ${attempt} check(s): ${COUNT} instance(s) on ${TEMPLATE}."
              DONE=1
              break
            fi

            if [ $(( attempt % 6 )) -eq 1 ]; then
              echo "rolling... (check ${attempt}/60, stable=${STABLE}, all-on-target=${ON_TARGET}, instances=${COUNT})"
            fi
            sleep 20
          done

          echo "::group::Instances"
          gcloud compute instance-groups managed list-instances "$APP_MIG" \
            --region="$APP_REGION" \
            --format='table(name,instanceStatus,version.instanceTemplate.basename(),instanceHealth[0].detailedHealthState)'
          echo "::endgroup::"

          if [ "$DONE" -ne 1 ]; then
            echo "::error::The group did not finish rolling onto ${TEMPLATE} within 20 minutes."
            exit 1
          fi

          FAILED=0
          while read -r NAME STATUS ITEMPLATE HEALTH; do
            [ -z "${NAME:-}" ] && continue
            if [ "$STATUS" != "RUNNING" ]; then
              echo "::error::${NAME} is ${STATUS}, not RUNNING."
              FAILED=1
            elif [ "$HEALTH" != "HEALTHY" ]; then
              echo "::error::${NAME} reports health ${HEALTH:-unknown}."
              FAILED=1
            else
              echo "${NAME}: ${TEMPLATE}, RUNNING, HEALTHY"
            fi
          done < <(instances)

          exit "$FAILED"

      # Other environments have their own VPC and are not routable from the ops
      # runner, so the per-instance verdict comes from the health check instead.
      - name: Verify each instance through the load balancer's health check
        id: vms_lb
        if: inputs.environment != 'dev'
        env:
          ENVIRONMENT: ${{ inputs.environment }}
        run: |
          set -euo pipefail

          echo "::notice::${ENVIRONMENT} is in its own VPC and is not routable from the ops runner. Using the load balancer's per-instance health state, which requests the same ${HEALTH_PATH}."

          : > vm-health.md
          COUNT=0
          FAILED=0

          while read -r NAME STATUS HEALTH; do
            [ -z "${NAME:-}" ] && continue
            COUNT=$(( COUNT + 1 ))
            echo "| \`${NAME}\` | health check | ${STATUS} | ${HEALTH:-unknown} |" >> vm-health.md
            if [ "$STATUS" != "RUNNING" ] || [ "$HEALTH" != "HEALTHY" ]; then
              echo "::error::${NAME} is ${STATUS}/${HEALTH:-unknown}."
              FAILED=1
            else
              echo "${NAME}: ${STATUS}, ${HEALTH}"
            fi
          done < <(
            gcloud compute instance-groups managed list-instances "$APP_MIG" \
              --region="$APP_REGION" \
              --format='value(name,instanceStatus,instanceHealth[0].detailedHealthState)'
          )

          if [ "$COUNT" -eq 0 ]; then
            echo "::error::The managed instance group ${APP_MIG} is empty."
            exit 1
          fi

          echo "count=${COUNT}" >> "$GITHUB_OUTPUT"
          exit "$FAILED"

      - name: Verify each instance directly
        id: vms
        if: inputs.environment == 'dev'
        run: |
          set -euo pipefail

          # Scoped by name: the 'app' tag is per-VPC and used by every environment.
          mapfile -t INSTANCES < <(
            gcloud compute instances list \
              --filter="tags.items=app AND name~^${APP_INSTANCE_PREFIX} AND status=RUNNING AND zone:${APP_REGION}" \
              --format='value(name,networkInterfaces[0].networkIP)'
          )

          if [ "${#INSTANCES[@]}" -eq 0 ]; then
            echo "::error::No RUNNING instances named ${APP_INSTANCE_PREFIX}* and tagged 'app'. The managed instance group for this environment is empty."
            exit 1
          fi

          : > vm-health.md
          FAILED=0

          for row in "${INSTANCES[@]}"; do
            NAME="$(echo "$row" | awk '{print $1}')"
            IP="$(echo "$row" | awk '{print $2}')"
            URL="http://${IP}:${APP_PORT}${HEALTH_PATH}"

            STATUS="unreachable"
            DB="-"

            for _ in $(seq 1 12); do
              if BODY="$(curl -fsS --max-time 5 "$URL" 2>/dev/null)"; then
                STATUS="$(echo "$BODY" | jq -r '.status // "unknown"')"
                DB="$(echo "$BODY" | jq -r '.components.db.status // "absent"')"
                [ "$STATUS" = "UP" ] && [ "$DB" = "UP" ] && break
              fi
              sleep 5
            done

            if [ "$STATUS" = "UP" ] && [ "$DB" = "UP" ]; then
              echo "| \`${NAME}\` | ${IP}:${APP_PORT} |  ${STATUS} |  ${DB} |" >> vm-health.md
              echo "${NAME} (${IP}): status=${STATUS} db=${DB}"
            else
              echo "| \`${NAME}\` | ${IP}:${APP_PORT} |  ${STATUS} |  ${DB} |" >> vm-health.md
              echo "::error::${NAME} (${IP}) is not serving: status=${STATUS} db=${DB}"
              FAILED=1
            fi
          done

          echo "count=${#INSTANCES[@]}" >> "$GITHUB_OUTPUT"
          exit "$FAILED"

      - name: Verify through the load balancer
        id: lb
        continue-on-error: true
        if: always()
        run: |
          set -euo pipefail

          LB_IP="$(gcloud compute addresses describe "$LB_ADDRESS_NAME" \
                     --global --format='value(address)')"
          LB_URL="https://${LB_IP}.sslip.io"
          echo "url=${LB_URL}" >> "$GITHUB_OUTPUT"

          AUDIENCE="$(gcloud compute backend-services describe "$LB_BACKEND_SERVICE" \
                        --global --format='value(iap.oauth2ClientId)')"

          if [ -z "$AUDIENCE" ]; then
            echo "result=no-client" >> "$GITHUB_OUTPUT"
            echo "::warning::Backend ${LB_BACKEND_SERVICE} reports no IAP OAuth client id. It is still on the Google-managed client, which does not support programmatic access - apply the infra change first."
            exit 0
          fi

          TOKEN="$(curl -sf -H 'Metadata-Flavor: Google' \
            "http://metadata.google.internal/computeMetadata/v1/instance/service-accounts/default/identity?audience=${AUDIENCE}&format=full")"

          CODE="$(curl -s -o /dev/null -w '%{http_code}' -k --max-time 20 \
                    -H "Authorization: Bearer ${TOKEN}" "${LB_URL}/" || echo 000)"

          echo "code=${CODE}" >> "$GITHUB_OUTPUT"

          if [ "$CODE" = "200" ]; then
            echo "result=ok" >> "$GITHUB_OUTPUT"
            echo "::notice::Load balancer answered 200 for ${LB_URL}"
          elif [ "$CODE" = "403" ] || [ "$CODE" = "401" ]; then
            echo "result=forbidden" >> "$GITHUB_OUTPUT"
            echo "::warning::IAP refused the runner's identity (HTTP ${CODE}). Expected only if sa-ops-vm has dropped off the backend service's accessor list - check LB_ALLOWED_MEMBERS. The application is verified healthy on every instance."
          else
            echo "result=unexpected" >> "$GITHUB_OUTPUT"
            echo "::warning::Load balancer returned HTTP ${CODE} for ${LB_URL}."
          fi

      - name: Deployment summary
        if: always()
        env:
          VERSION: ${{ inputs.version }}
          ENVIRONMENT: ${{ inputs.environment }}
          DIGEST: ${{ steps.resolve.outputs.digest }}
          IMAGE: ${{ steps.resolve.outputs.image }}
          IMAGE_TAG: ${{ steps.resolve.outputs.image_tag }}
          VM_COUNT: ${{ steps.vms.outputs.count || steps.vms_lb.outputs.count }}
          INFRA_RUN_URL: ${{ steps.infra.outputs.run_url }}
          PREVIOUS_DIGEST: ${{ steps.record.outputs.previous }}
          LB_URL: ${{ steps.lb.outputs.url }}
          LB_CODE: ${{ steps.lb.outputs.code }}
          LB_RESULT: ${{ steps.lb.outputs.result }}
        run: |
          set -euo pipefail

          {
            echo "## Deployed ${VERSION:-?} to ${ENVIRONMENT:-?}"
            echo

            if [ -n "${LB_URL:-}" ]; then
              echo "### 🔗 ${LB_URL}"
              echo
              echo "Sign in with a Google identity on the IAP allow-list. The certificate is self-signed, so a browser warns once."
            else
              echo "### Application link"
              echo
              echo "Not resolved."
            fi
            echo

            echo "| | |"
            echo "| --- | --- |"
            echo "| Version | \`${VERSION:-?}\` |"
            echo "| Environment | \`${ENVIRONMENT:-?}\` |"
            echo "| Image tag | \`${IMAGE_TAG:-unresolved}\` |"
            echo "| Digest | \`${DIGEST:-unresolved}\` |"
            echo "| Deployed reference | \`${IMAGE:-unresolved}\` |"
            echo "| Instances | ${VM_COUNT:-0} |"
            echo

            echo "### How this shipped"
            echo
            echo "The digest was written to \`gs://${DEPLOY_STATE_BUCKET}/deploy/${ENVIRONMENT}/app-image-digest\`,"
            echo "then \`${INFRA_REPO}\` applied: the instance template was rebuilt around the new"
            echo "metadata and the group replaced its instances, \`max_unavailable = 0\`. Nothing"
            echo "connected to a VM - the image was already complete."
            if [ -n "${INFRA_RUN_URL:-}" ]; then
              echo
              echo "[Infrastructure apply run](${INFRA_RUN_URL})"
            fi
            echo

            echo "### Per-instance health"
            echo
            echo "| Instance | Endpoint | Status | Database |"
            echo "| --- | --- | --- | --- |"
            if [ -f vm-health.md ]; then
              cat vm-health.md
            else
              echo "| - | - | not reached | - |"
            fi
            echo
            if [ "${ENVIRONMENT}" = "dev" ]; then
              echo "Checked against each internal IP, not through the load balancer. \`Database: UP\` is the Actuator \`db\` component."
            else
              echo "Checked through the load balancer's per-instance health check, which requests the same \`${HEALTH_PATH}\`. ${ENVIRONMENT} has its own VPC and is not routable from the ops runner, so there is no direct path to each instance. Spring Boot reports the aggregate DOWN when the database indicator is, so HEALTHY still means the database is connected."
            fi
            echo

            echo "### Load balancer"
            echo
            case "${LB_RESULT:-none}" in
              ok)         echo " HTTP ${LB_CODE} through IAP." ;;
              forbidden)  echo " HTTP ${LB_CODE} — IAP refused the runner's identity. \`sa-ops-vm\` is not on the backend service's accessor list. The link above works for a human on the allow-list." ;;
              no-client)  echo " Not checked — the backend service still uses the Google-managed OAuth client, which has no programmatic access. Apply the infra change that moves it to a custom client." ;;
              unexpected) echo " HTTP ${LB_CODE} — unexpected. Check the backend service health." ;;
              *)          echo "Not checked." ;;
            esac
            echo

            echo "### Rollback"
            echo
            echo "Rollback is redeploy — dispatch this workflow with an older version:"
            echo
            echo '```sh'
            echo "gh workflow run deploy.yml -R ${GITHUB_REPOSITORY} \\"
            echo "  -f version=<previous-version> \\"
            echo "  -f environment=${ENVIRONMENT}"
            echo '```'
            if [ -n "${PREVIOUS_DIGEST:-}" ]; then
              echo
              echo "The version this replaced was \`${PREVIOUS_DIGEST}\`."
            fi
            echo
            echo "[Artifact Registry](https://console.cloud.google.com/artifacts/docker/petclinic-capstone/europe-west3/petclinic/petclinic-app) · [tags](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/tags)"
          } >> "$GITHUB_STEP_SUMMARY"

